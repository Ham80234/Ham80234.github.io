<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Protected Message</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input[type="text"] {
      width: 80%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    .error-message {
      color: red;
      margin-top: 15px;
      display: none;
    }

    .secret-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #e7f4e4;
      border: 1px solid #c3e6cb;
      color: #155724;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Password Form Section -->
    <div id="login-form">
      <h2>Enter Password</h2>
      <input type="text" id="passwordInput" placeholder="Enter password...">
      <br>
      <button onclick="checkPassword()">Submit</button>
      <p id="error" class="error-message">Incorrect password. Try again!</p>
    </div>

    <!-- Hidden Message Section -->
    <div id="message" class="secret-message">
      <h3>Help Me!</h3>
      <p> I am stuck!</p>
      <h3>14 - 9 = ?</h3>
      <h3>10 - 2 = ?</h3>
      <h3>28 - 26 = ?</h3>
      <p><i>Lovity</i></p>
    </div>
  </div>

  <script>
    function checkPassword() {
      // Set your password here
      const correctPassword = "The quick brown fox jumped over the lazy dog.";

      // Get the value typed by the user
      const userInput = document.getElementById("passwordInput").value;
      const errorMessage = document.getElementById("error");
      const loginForm = document.getElementById("login-form");
      const secretMessage = document.getElementById("message");

      if (userInput === correctPassword) {
        // Hide the input form and show the secret message
        loginForm.style.display = "none";
        secretMessage.style.display = "block";
      } else {
        // Show error message if password is incorrect
        errorMessage.style.display = "block";
      }
    }
  </script>

</body>
</html>
