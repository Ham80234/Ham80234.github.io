<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Audio Player</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin-slow 8s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-6 flex flex-col gap-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight text-slate-100">Audio Player</h1>
            <span id="status-badge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium">Ready</span>
        </div>

        <!-- Vinyl & Visualizer Display -->
        <div class="relative w-48 h-48 mx-auto flex items-center justify-center">
            <!-- Vinyl Record Graphic -->
            <div id="vinyl" class="w-full h-full rounded-full bg-black border-4 border-slate-800 shadow-inner flex items-center justify-center animate-spin-slow paused relative overflow-hidden">
                <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 via-black to-slate-950 opacity-80"></div>
                <!-- Vinyl Grooves -->
                <div class="absolute inset-3 rounded-full border border-slate-800/60"></div>
                <div class="absolute inset-8 rounded-full border border-slate-800/60"></div>
                <div class="absolute inset-14 rounded-full border border-slate-800/60"></div>
                <!-- Center Label -->
                <div class="w-16 h-16 rounded-full bg-indigo-600 border-2 border-indigo-400 flex items-center justify-center relative z-10 shadow-md">
                    <div class="w-4 h-4 rounded-full bg-black border border-slate-700"></div>
                </div>
            </div>
        </div>

        <!-- Track Info -->
        <div class="text-center space-y-1">
            <h2 id="track-title" class="text-lg font-semibold truncate text-slate-200">No track selected</h2>
            <p id="track-artist" class="text-xs text-slate-400">Choose from playlist or upload</p>
        </div>

        <!-- Waveform / Canvas Visualizer -->
        <div class="w-full h-12 bg-slate-950/60 rounded-lg overflow-hidden border border-slate-800/60 flex items-center px-2">
            <canvas id="visualizer" class="w-full h-full"></canvas>
        </div>

        <!-- Progress Bar -->
        <div class="space-y-1">
            <div class="flex justify-between text-xs text-slate-400 font-mono">
                <span id="current-time">0:00</span>
                <span id="duration">0:00</span>
            </div>
            <input type="range" id="progress-bar" value="0" max="100" step="0.1" 
                class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-indigo-500">
        </div>

        <!-- Playback Controls -->
        <div class="flex items-center justify-center gap-4">
            <!-- Loop Toggle -->
            <button id="btn-loop" title="Toggle Loop" class="p-2.5 rounded-xl bg-slate-800/50 hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                </svg>
            </button>

            <!-- Play / Pause Button -->
            <button id="btn-play" class="w-14 h-14 rounded-2xl bg-indigo-600 hover:bg-indigo-500 text-white flex items-center justify-center shadow-lg shadow-indigo-600/30 transition transform active:scale-95">
                <svg id="icon-play" class="w-6 h-6 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5v14l11-7z"/>
                </svg>
                <svg id="icon-pause" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- Volume Control -->
            <div class="flex items-center gap-2 bg-slate-800/50 px-3 py-2 rounded-xl">
                <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
                </svg>
                <input type="range" id="volume-bar" min="0" max="1" step="0.01" value="1" 
                    class="w-16 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
            </div>
        </div>

        <!-- Playlist & Local File Picker -->
        <div class="border-t border-slate-800 pt-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Playlist (`./audio/`)</span>
                <label class="text-xs text-indigo-400 hover:text-indigo-300 cursor-pointer font-medium">
                    + Add Local Files
                    <input type="file" id="local-file-input" accept="audio/*" multiple class="hidden">
                </label>
            </div>
            <div id="playlist-container" class="max-h-36 overflow-y-auto space-y-1.5 pr-1">
                <!-- Populated dynamically -->
            </div>
        </div>

    </div>

    <audio id="audio-element"></audio>

    <script>
        // EDIT THIS ARRAY to match the exact filenames inside your GitHub repo's `./audio/` folder
        const defaultPlaylist = [
            { name: "Track 1", src: "./audio/track1.mp3" },
            { name: "Track 2", src: "./audio/track2.mp3" }
        ];

        const audioElement = document.getElementById('audio-element');
        const playBtn = document.getElementById('btn-play');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const vinyl = document.getElementById('vinyl');
        const progressBar = document.getElementById('progress-bar');
        const volumeBar = document.getElementById('volume-bar');
        const currentTimeEl = document.getElementById('current-time');
        const durationEl = document.getElementById('duration');
        const trackTitle = document.getElementById('track-title');
        const trackArtist = document.getElementById('track-artist');
        const playlistContainer = document.getElementById('playlist-container');
        const localFileInput = document.getElementById('local-file-input');
        const statusBadge = document.getElementById('status-badge');
        const loopBtn = document.getElementById('btn-loop');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        let playlist = [...defaultPlaylist];
        let currentIndex = 0;
        let isLooping = false;
        let audioCtx, analyser, sourceNode;

        function initPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2 rounded-lg text-xs cursor-pointer transition ${index === currentIndex ? 'bg-indigo-600/20 border border-indigo-500/40 text-indigo-200' : 'bg-slate-800/40 hover:bg-slate-800 text-slate-300'}`;
                item.innerHTML = `
                    <span class="truncate font-medium">${track.name}</span>
                    <span class="text-[10px] text-slate-500">${index === currentIndex ? 'Playing' : ''}</span>
                `;
                item.onclick = () => loadTrack(index, true);
                playlistContainer.appendChild(item);
            });
        }

        function loadTrack(index, autoPlay = false) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const track = playlist[currentIndex];
            
            audioElement.src = track.src;
            trackTitle.textContent = track.name;
            trackArtist.textContent = track.src.startsWith('blob:') ? 'Local Upload' : './audio/';
            initPlaylist();

            if (autoPlay) {
                playAudio();
            } else {
                pauseAudio();
            }
        }

        function playAudio() {
            if (!audioElement.src) {
                if (playlist.length > 0) loadTrack(0);
                else return;
            }
            audioElement.play().then(() => {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
                vinyl.classList.remove('paused');
                statusBadge.textContent = "Playing";
                statusBadge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 font-medium";
                initAudioContext();
            }).catch(err => {
                console.error("Playback error:", err);
                statusBadge.textContent = "Error loading file";
            });
        }

        function pauseAudio() {
            audioElement.pause();
            iconPlay.classList.remove('hidden');
            iconPause.classList.add('hidden');
            vinyl.classList.add('paused');
            statusBadge.textContent = "Paused";
            statusBadge.className = "text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium";
        }

        playBtn.onclick = () => {
            if (audioElement.paused) {
                playAudio();
            } else {
                pauseAudio();
            }
        };

        // Track time updates
        audioElement.ontimeupdate = () => {
            if (audioElement.duration) {
                const progress = (audioElement.currentTime / audioElement.duration) * 100;
                progressBar.value = progress;
                currentTimeEl.textContent = formatTime(audioElement.currentTime);
            }
        };

        audioElement.onloadedmetadata = () => {
            durationEl.textContent = formatTime(audioElement.duration);
        };

        // When track finishes playing -> STOP completely (per your preference)
        audioElement.onended = () => {
            pauseAudio();
            audioElement.currentTime = 0;
            progressBar.value = 0;
        };

        progressBar.oninput = () => {
            if (audioElement.duration) {
                audioElement.currentTime = (progressBar.value / 100) * audioElement.duration;
            }
        };

        volumeBar.oninput = () => {
            audioElement.volume = volumeBar.value;
        };

        loopBtn.onclick = () => {
            isLooping = !isLooping;
            audioElement.loop = isLooping;
            loopBtn.classList.toggle('text-indigo-400', isLooping);
            loopBtn.classList.toggle('bg-indigo-600/20', isLooping);
        };

        // Local file upload handling
        localFileInput.onchange = (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                const fileURL = URL.createObjectURL(file);
                playlist.push({ name: file.name.replace(/\.[^/.]+$/, ""), src: fileURL });
            });
            initPlaylist();
            if (playlist.length === files.length) {
                loadTrack(0, false);
            }
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Visualizer Setup
        function initAudioContext() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                sourceNode = audioCtx.createMediaElementSource(audioElement);
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 64;
                visualize();
            } catch (e) {
                console.log("Web Audio API not supported", e);
            }
        }

        function visualize() {
            requestAnimationFrame(visualize);
            if (!analyser) return;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;
            const width = canvas.width;
            const height = canvas.height;

            canvasCtx.clearRect(0, 0, width, height);

            const barWidth = (width / bufferLength) * 2.5;
            let x = 0;

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * height;
                canvasCtx.fillStyle = '#6366f1';
                canvasCtx.fillRect(x, height - barHeight, barWidth, barHeight);
                x += barWidth + 1;
            }
        }

        // Initialize view
        if (playlist.length > 0) {
            loadTrack(0, false);
        }
    </script>
</body>
</html>
